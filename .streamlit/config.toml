[theme]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4FF"
textColor = "#1A1B2E"
font = "sans serif"

[server]
# Templates are small; a low cap keeps well inside Community Cloud's 1 GB per-app memory.
maxUploadSize = 25
headless = true

[browser]
gatherUsageStats = false
